<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0F">
<title>PedalSistema · Monitor</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <span class="dot" id="dot-conexion"></span>
    <span id="txt-estado">Conectando…</span>
  </div>
  <div class="topbar-right" id="txt-cpu"></div>
</header>

<div class="modo-switch">
  <button class="modo-btn activo" id="btn-modo-mezcla" type="button">MEZCLA</button>
  <button class="modo-btn" id="btn-modo-preset" type="button">PRESET</button>
</div>

<main id="app">
  <div class="cargando" id="cargando">Cargando…</div>
</main>

<nav class="tabs" id="tabs" hidden></nav>

<script src="app.js"></script>
</body>
</html>
