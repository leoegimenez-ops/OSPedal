<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Arquitec DSP</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="cabecera" id="cabecera">
  <button class="cab-btn" id="btn-prev" type="button" aria-label="Previous preset">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="cab-btn" id="btn-next" type="button" aria-label="Next preset">
    <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <div class="cab-nombre">
    <span class="cab-codigo" id="cab-codigo">–</span>
    <span class="cab-preset" id="cab-preset">Loading…</span>
  </div>
  <button class="cab-btn" id="btn-guardar" type="button" aria-label="Save preset">
    <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>
  </button>
  <button class="cab-btn cab-menu" id="btn-menu" type="button" aria-label="Menu">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.3" class="relleno"/><circle cx="12" cy="12" r="1.3" class="relleno"/><circle cx="12" cy="18.5" r="1.3" class="relleno"/></svg>
    <span class="punto-estado" id="punto-estado"></span>
  </button>
  <div class="cab-escenas" id="cab-escenas"></div>
</header>

<main class="contenido" id="contenido"></main>

<section class="panel-bloque" id="panel-bloque" hidden></section>

<nav class="barra-tabs" id="barra-tabs">
  <button class="tab" data-tab="grid" type="button">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="5" height="5" rx="1.2"/><rect x="10" y="5" width="5" height="5" rx="1.2"/><rect x="3" y="14" width="5" height="5" rx="1.2"/><path d="M15 16.5h6M18 13.5v6"/></svg>
    <span>GRID</span>
  </button>
  <button class="tab" data-tab="presets" type="button">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7" rx="1.2"/><rect x="13" y="4" width="8" height="7" rx="1.2"/><rect x="3" y="13" width="8" height="7" rx="1.2"/><rect x="13" y="13" width="8" height="7" rx="1.2"/></svg>
    <span>PRESETS</span>
  </button>
  <button class="tab" data-tab="gig" type="button">
    <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"/><circle cx="8" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="16" cy="12" r="1.6"/></svg>
    <span>GIG</span>
  </button>
  <button class="tab" data-tab="sends" type="button">
    <svg viewBox="0 0 24 24"><path d="M6 4v16M12 4v16M18 4v16"/><rect x="4" y="13" width="4" height="3" rx="1" class="relleno"/><rect x="10" y="7" width="4" height="3" rx="1" class="relleno"/><rect x="16" y="15" width="4" height="3" rx="1" class="relleno"/></svg>
    <span>SENDS</span>
  </button>
</nav>

<div class="velo" id="velo" hidden></div>
<div class="popover" id="popover" hidden></div>
<div class="selector" id="selector" hidden></div>
<div class="modal" id="modal" hidden role="dialog"></div>
<div class="aviso" id="aviso" hidden></div>

<script src="app.js"></script>
</body>
</html>
